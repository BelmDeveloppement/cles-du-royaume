<script>/* © 2026 SAS BELM DEVELOPPEMENT. Tous droits réservés.  Les clés du royaume : application compagnon (jeu 11). */
'use strict';
const KR = {};
KR.DOM = {S:{nom:'SEGMENTER',c:'#1F6FA8'},A:{nom:'AUTHENTIFIER',c:'#7B3F98'},Z:{nom:'AUTORISER',c:'#C77700'},T:{nom:'TRACER',c:'#1E7B45'}};
KR.TEAMCOL = [['Rouge','#D7352B'],['Jaune','#E0A800'],['Bleu','#1E5FBF'],['Vert','#2E9E4F'],['Noir','#4B5563']];
KR.DEFAULT_RELAY = 'https://ntfy.sh';
KR.TITRES = [[55,'RSSI de l’année'],[45,'RSSI'],[35,'Administrateur'],[25,'Technicien'],[0,'Stagiaire']];
KR.titre = p => (KR.TITRES.find(t => p >= t[0]) || KR.TITRES[4])[1];
KR.LET = ['A','B','C','D'];
KR.STEPNAME = {dg:'Décision du DG', mission:'Mission', marche:'Marché', menaces:'Menaces', next:'Semaine suivante'};
KR.TEMPS = {dg:1, mission:2, marche:3, menaces:4, next:5};
KR.steps = (function () {
  const s = [{k:'lobby', w:0}];
  for (let w = 1; w <= 6; w++) {
    if (w > 1) s.push({k:'dg', w});
    s.push({k:'mission', w}, {k:'marche', w}, {k:'menaces', w});
    if (w < 6) s.push({k:'next', w});
  }
  ['IN1','IN2','IN3','IN4'].forEach(id => s.push({k:'inj', id, w:7}));
  s.push({k:'final', w:7}, {k:'bonus', w:7}, {k:'end', w:7});
  return s;
})();
KR.stepLabel = st => {
  if (!st) return '';
  if (st.k === 'lobby') return 'Accueil · constitution des équipes';
  if (st.k === 'inj') return 'Week-end de crise · ' + st.id.replace('IN', 'inject ');
  if (st.k === 'final') return 'Vendredi 23 h 58 · l’attaque finale';
  if (st.k === 'bonus') return 'Décompte final';
  if (st.k === 'end') return 'Fin de partie';
  return 'Semaine ' + st.w + ' sur 6 · Temps ' + KR.TEMPS[st.k] + ' sur 5 · ' + KR.STEPNAME[st.k];
};
KR.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
KR.sleep = ms => new Promise(r => setTimeout(r, ms));
KR.rid = (n) => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
KR.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
KR.mesureByN = n => KR.PUB.mesures.find(m => m[0] === n);
KR.owned = t => KR.PUB.mesures.filter(m => t.m[m[0] - 1]).map(m => m[0]);

/* ---------------- Relais (ntfy) ---------------- */
KR.Relay = function (base, sid) {
  this.base = (base || KR.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'kr' + sid + 'h'; this.tP = 'kr' + sid + 'p';
  this.status = 'init';
};
KR.Relay.prototype.post = async function (topic, obj) {
  const body = JSON.stringify(obj);
  for (let i = 0; i < 4; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method:'POST', body}); if (r.ok) return true; if (r.status === 429) await KR.sleep(3000); }
    catch (e) { /* réseau */ }
    await KR.sleep(500 * (i + 1));
  }
  return false;
};
KR.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false;
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => onstatus && onstatus('ok');
    es.onerror = () => { onstatus && onstatus('retry'); try { es.close(); } catch (e) {} setTimeout(open, 2500); };
    es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      onmsg(o, m);
    };
  };
  open();
  return () => { dead = true; try { es.close(); } catch (e) {} };
};
/* Etat diffusé en morceaux (limite ntfy : 4096 octets) */
KR.CH = 1500;
KR.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / KR.CH);
  this._pending = {v: st.v, s, n};
  if (this._busy) return;
  this._busy = true;
  (async () => {
    while (this._pending) {
      const p = this._pending; this._pending = null;
      let ok = true;
      for (let i = 0; i < p.n && ok; i++) ok = await this.post(this.tH, {v: p.v, i, n: p.n, d: p.s.slice(i * KR.CH, (i + 1) * KR.CH)});
      this.lastOk = ok;
    }
    this._busy = false;
  })();
};
KR.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const p = parts[o.v] || (parts[o.v] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (+k < cur) delete parts[k]; });
    }
  };
};

/* ---------------- Utilitaires d'affichage ---------------- */
KR.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

}).join('');
KR.CSS = `

</script><script>KR.PUB={"missions":[{"id":"MI01","titre":"L’adresse MAC et son fabricant","dom":"S","contexte":"Un scanner inconnu apparaît sur le réseau de l’entrepôt avec l’adresse MAC 00:1A:2B:3C:4D:5E. Le filtrage MAC de TransLor ne contient que les 40 adresses de l’inventaire.","q1":"Quelle partie de l’adresse identifie le fabricant, et combien de bits représente-t-elle ?","o1":["L’OUI, 00:1A:2B : 24 bits (les 3 premiers octets)","L’OUI, 3C:4D:5E : 24 bits (les 3 derniers octets)","L’OUI, 00:1A:2B : 12 bits (les 3 premiers chiffres hexadécimaux)","Le NIC, 00:1A:2B : 48 bits (l’adresse entière)"],"q2":"Pourquoi le filtrage MAC ne suffit-il pas pour sécuriser l’accès à l’entrepôt ?","opts":["Parce qu’une adresse MAC a 48 bits","Parce que les switchs ne savent pas filtrer les MAC","Parce que le filtrage MAC est interdit par la loi","Parce qu’elle circule en clair et se copie facilement : elle n’authentifie rien"]},{"id":"MI02","titre":"Quel masque générique ?","dom":"S","contexte":"Une ACL doit autoriser le bloc de la direction : 10.1.20.64/27. Le routeur Cisco veut un masque générique (wildcard).","q1":"Donnez la première adresse, la dernière adresse et le masque générique de ce bloc.","o1":["10.1.20.64 à 10.1.20.127 ; masque générique 0.0.0.63","10.1.20.64 à 10.1.20.95 ; masque générique 255.255.255.224","10.1.20.64 à 10.1.20.95 ; masque générique 0.0.0.31","10.1.20.65 à 10.1.20.94 ; masque générique 0.0.0.30"],"q2":"Quelle ligne autorise ce bloc, et lui seul, vers le serveur de fichiers 10.1.40.10 ?","opts":["permit ip 10.1.20.64 0.0.0.255 host 10.1.40.10","permit ip 10.1.20.64 0.0.0.31 host 10.1.40.10","permit ip 10.1.20.0 0.0.0.31 host 10.1.40.10","permit ip any host 10.1.40.10"]},{"id":"MI03","titre":"L’ordre des règles","dom":"S","contexte":"Une ACL de TransLor, lue de haut en bas : (1) deny ip host 10.1.30.5 any ; (2) permit ip 10.1.30.0 0.0.0.255 any ; (3) deny ip any any. La première règle qui correspond s’applique.","q1":"Que devient un paquet venant de 10.1.30.5, un autre de 10.1.30.6, un troisième de 10.1.40.1 ?","o1":[".5 refusé, .6 autorisé, 10.1.40.1 refusé",".5 autorisé, .6 autorisé, 10.1.40.1 refusé",".5 refusé, .6 refusé, 10.1.40.1 refusé",".5 refusé, .6 autorisé, 10.1.40.1 autorisé"],"q2":"On inverse les règles 1 et 2. Que devient 10.1.30.5 ?","opts":["Il reste refusé","Il est mis en quarantaine","Il est autorisé, la règle large passe avant la règle précise","Le routeur affiche une erreur"]},{"id":"MI04","titre":"Lire la configuration d’un trunk","dom":"S","contexte":"Configuration du trunk entre deux switchs : allowed vlan 10,20,30,40 ; native vlan 10. Les VLAN 10 (direction), 20 (entrepôt), 30 (tablettes), 40 (serveurs) circulent.","q1":"Combien de VLAN circulent avec une étiquette 802.1Q et lequel circule sans étiquette ?","o1":["3 VLAN étiquetés (20, 30, 40) ; le VLAN 10 sans étiquette","4 VLAN étiquetés (10, 20, 30, 40) ; aucun sans étiquette","3 VLAN étiquetés (10, 20, 30) ; le VLAN 40 sans étiquette","1 VLAN étiqueté (10) ; les VLAN 20, 30, 40 sans étiquette"],"q2":"Quelle correction durcit ce trunk contre le double tag ?","opts":["Passer le native VLAN sur le VLAN 40 des serveurs","Supprimer le VLAN 20","Autoriser tous les VLAN sur le trunk","Utiliser un native VLAN dédié et inutilisé (ex. 999)"]},{"id":"MI05","titre":"Découper le réseau plat de TransLor","dom":"S","contexte":"TransLor veut séparer cinq VLAN : direction 24 postes, entrepôt 40, tablettes 100, serveurs 10, invités 30. Prévoir 1 adresse de passerelle par VLAN, sans croissance. Tailles disponibles : /27 (30 utilisables), /26 (62), /25 (126), /28 (14).","q1":"Donnez le masque de chaque VLAN.","o1":["direction /27 · entrepôt /26 · tablettes /25 · serveurs /28 · invités /27","direction /28 · entrepôt /27 · tablettes /26 · serveurs /29 · invités /27","direction /26 · entrepôt /26 · tablettes /26 · serveurs /26 · invités /26","direction /27 · entrepôt /26 · tablettes /25 · serveurs /28 · invités /26"],"q2":"Les cinq blocs tiennent-ils dans l’actuel 192.168.1.0/24 (256 adresses) ?","opts":["Oui, il reste de la marge","Non : 32 + 64 + 128 + 16 + 64 = 304, supérieur à 256","Oui : 32 + 64 + 128 + 16 + 64 = 244","Non : 24 + 40 + 100 + 10 + 30 = 204, supérieur à 256"]},{"id":"MI06","titre":"Qui devient Root Bridge ?","dom":"S","contexte":"Trois switchs STP : SW1 priorité 32768, MAC 00:1A:00:00:00:10 ; SW2 priorité 32768, MAC 00:1A:00:00:00:05 ; SW3 priorité 16384, MAC 00:1A:00:00:00:FF. Le Root Bridge est le switch avec la priorité la plus basse ; en cas d’égalité, l’adresse MAC la plus basse.","q1":"Quel switch devient Root Bridge ? Et si SW3 est éteint ?","o1":["SW3 (priorité 16384) ; sans SW3, SW2 (MAC la plus basse)","SW2 (MAC la plus basse) ; sans SW2, SW1","SW3 (priorité 16384) ; sans SW3, SW1 (MAC la plus haute)","SW1 (priorité 32768, la plus haute) ; sans SW1, SW3"],"q2":"Comment empêcher un switch inconnu, branché en salle de pause, de devenir racine ?","opts":["Lui donner un autre nom","Désactiver STP partout","Activer Root Guard et BPDU Guard sur les ports d’accès","Augmenter la priorité de SW3"]},{"id":"MI07","titre":"Combien de temps pour casser ?","dom":"A","contexte":"Un attaquant teste 10 milliards (10¹⁰) de mots de passe par seconde contre des hachés rapides. Un gestionnaire a choisi 10 caractères parmi 36 (minuscules et chiffres). La politique voudrait 12 caractères parmi 62.","q1":"Combien de temps pour tester toutes les combinaisons de ce mot de passe de 10 caractères ?","o1":["Environ 4,2 heures","Environ 42 jours","Environ 4,2 ans","Environ 4,2 jours"],"q2":"Quel est l’ordre de grandeur pour 12 caractères parmi 62 ?","opts":["Environ 4 jours encore","Environ 10 200 ans","Environ 6 heures","Environ 3 secondes"]},{"id":"MI08","titre":"Lire une ligne de /etc/shadow","dom":"A","contexte":"Ligne du serveur Linux de TransLor : alice:$6$Xq3k9a$Rj0w…Zt1:19700:0:90:7:::  Le préfixe $6$ désigne SHA-512 ; entre le deuxième et le troisième $ se trouve le sel.","q1":"Quel est l’algorithme, quel est le sel, et au bout de combien de jours le mot de passe doit-il être changé ?","o1":["SHA-256 ; sel Xq3k9a ; 90 jours","SHA-512 ; sel Rj0w…Zt1 ; 90 jours","SHA-512 ; sel Xq3k9a ; 90 jours","SHA-512 ; sel Xq3k9a ; 7 jours"],"q2":"Deux utilisateurs ont le même mot de passe mais des sels différents. Que voit-on dans le fichier ?","opts":["Deux hachés identiques","Un seul haché pour les deux","Aucun haché","Deux hachés différents"]},{"id":"MI09","titre":"Combien de mots de passe identiques ?","dom":"A","contexte":"Extrait d’une base SANS sel : bob 5f4dcc3b…cf99 ; carole 482c811d…a0b3 ; dan 5f4dcc3b…cf99 ; eve 5f4dcc3b…cf99 ; fred 7c6a180b…1d0a ; gina 5f4dcc3b…cf99.","q1":"Combien de comptes ont le même mot de passe, et quelle part des 6 cela représente-t-il ?","o1":["3 comptes (bob, dan, eve) ; 50 %","4 comptes (bob, dan, eve, gina) ; 67 %","4 comptes (bob, dan, eve, gina) ; 40 %","2 comptes (bob, dan) ; 33 %"],"q2":"Quelle correction supprime ce problème ?","opts":["Un haché plus court","Cacher la base de données","Un haché lent avec un sel différent par compte","Demander aux utilisateurs de ne pas choisir le même mot de passe"]},{"id":"MI10","titre":"Les facteurs d’authentification","dom":"A","contexte":"TransLor prépare le MFA. Quatre éléments : (1) code TOTP de l’application ; (2) code PIN de 6 chiffres ; (3) empreinte digitale ; (4) clé de sécurité USB FIDO2.","q1":"Classez chaque élément : connaissance, possession ou inhérence.","o1":["1 connaissance · 2 connaissance · 3 inhérence · 4 possession","1 possession · 2 possession · 3 inhérence · 4 possession","1 possession · 2 connaissance · 3 inhérence · 4 possession","1 possession · 2 connaissance · 3 possession · 4 inhérence"],"q2":"Un PIN et un mot de passe forment-ils une authentification multifacteur ?","opts":["Non, ce sont deux facteurs de connaissance","Oui, ce sont deux éléments","Oui, car le PIN est court","Non, il manque l’empreinte"]},{"id":"MI11","titre":"La fatigue MFA","dom":"A","contexte":"Journal du
