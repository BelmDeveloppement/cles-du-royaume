<script>/* © 2026 SAS BELM DEVELOPPEMENT. Tous droits réservés.  Les clés du royaume : application compagnon (jeu 11). */
'use strict';
const KR = {};
KR.DOM = {S:{nom:'SEGMENTER',c:'#1F6FA8'},A:{nom:'AUTHENTIFIER',c:'#7B3F98'},Z:{nom:'AUTORISER',c:'#C77700'},T:{nom:'TRACER',c:'#1E7B45'}};
KR.TEAMCOL = [['Rouge','#D64541'],['Bleu','#2E6FD8'],['Vert','#2E9E6B'],['Jaune','#D9A400'],['Violet','#8E44AD']];
KR.DEFAULT_RELAY = 'https://ntfy.sh';
KR.TITRES = [[55,'RSSI de l’année'],[45,'RSSI'],[35,'Administrateur'],[25,'Technicien'],[0,'Stagiaire']];
KR.titre = p => (KR.TITRES.find(t => p >= t[0]) || KR.TITRES[4])[1];

KR.TEMPS = {dg:1, mission:2, marche:3, menaces:4, next:5};
KR.steps = (function () {
  const s = [{k:'lobby', w:0}];
  for (let w = 1; w <= 6; w++) {
    if (w > 1) s.push({k:'dg', w});
    s.push({k:'mission', w}, {k:'marche', w}, {k:'menaces', w});
    if (w < 6) s.push({k:'next', w});
  }
  ['IN1','IN2','IN3','IN4'].forEach(id => s.push({k:'inj', id, w:7}));
  s.push({k:'final', w:7}, {k:'bonus', w:7}, {k:'end', w:7});
  return s;
})();
KR.stepLabel = st => {
  if (!st) return '';
  if (st.k === 'lobby') return 'Accueil · constitution des équipes';
  if (st.k === 'inj') return 'Week-end de crise · ' + st.id.replace('IN', 'inject ');
  if (st.k === 'final') return 'Vendredi 23 h 58 · l’attaque finale';
  if (st.k === 'bonus') return 'Décompte final';
  if (st.k === 'end') return 'Fin de partie';
  return 'Semaine ' + st.w + ' sur 6 · Temps ' + KR.TEMPS[st.k] + ' sur 5 · ' + KR.STEPNAME[st.k];
};
KR.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
KR.sleep = ms => new Promise(r => setTimeout(r, ms));
KR.rid = (n) => { const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const b = new Uint8Array(n); crypto.getRandomValues(b); b.forEach(x => s += a[x % a.length]); return s; };
KR.hash = () => { const o = {}; location.hash.replace(/^#/, '').split('&').forEach(p => { const i = p.indexOf('='); if (i > 0) o[p.slice(0, i)] = decodeURIComponent(p.slice(i + 1)); }); return o; };
KR.mesureByN = n => KR.PUB.mesures.find(m => m[0] === n);
KR.owned = t => KR.PUB.mesures.filter(m => t.m[m[0] - 1]).map(m => m[0]);

/* ---------------- Relais (ntfy) ---------------- */
KR.Relay = function (base, sid) {
  this.base = (base || KR.DEFAULT_RELAY).replace(/\/+$/, '');
  this.tH = 'kr' + sid + 'h'; this.tP = 'kr' + sid + 'p';
  this.status = 'init';
};
KR.Relay.prototype.post = async function (topic, obj) {
  const body = JSON.stringify(obj);
  for (let i = 0; i < 4; i++) {
    try { const r = await fetch(this.base + '/' + topic, {method:'POST', body}); if (r.ok) return true; if (r.status === 429) await KR.sleep(3000); }
    catch (e) { /* réseau */ }
    await KR.sleep(500 * (i + 1));
  }
  return false;
};
KR.Relay.prototype.sub = function (topic, since, onmsg, onstatus) {
  let last = since, es = null, dead = false;
  const open = () => {
    if (dead) return;
    es = new EventSource(this.base + '/' + topic + '/sse?since=' + encodeURIComponent(last));
    es.onopen = () => onstatus && onstatus('ok');
    es.onerror = () => { onstatus && onstatus('retry'); try { es.close(); } catch (e) {} setTimeout(open, 2500); };
    es.onmessage = e => {
      let m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.event && m.event !== 'message') return;
      if (m.id) last = m.id;
      let o; try { o = JSON.parse(m.message); } catch (x) { return; }
      onmsg(o, m);
    };
  };
  open();
  return () => { dead = true; try { es.close(); } catch (e) {} };
};
/* Etat diffusé en morceaux (limite ntfy : 4096 octets) */
KR.CH = 1500;
KR.Relay.prototype.pubState = function (st) {
  const s = JSON.stringify(st), n = Math.ceil(s.length / KR.CH);
  this._pending = {v: st.v, s, n};
  if (this._busy) return;
  this._busy = true;
  (async () => {
    while (this._pending) {
      const p = this._pending; this._pending = null;
      let ok = true;
      for (let i = 0; i < p.n && ok; i++) ok = await this.post(this.tH, {v: p.v, i, n: p.n, d: p.s.slice(i * KR.CH, (i + 1) * KR.CH)});
      this.lastOk = ok;
    }
    this._busy = false;
  })();
};
KR.Assembler = function (cb) {
  const parts = {}; let cur = -1;
  return o => {
    if (o == null || o.v == null || o.v < cur) return;
    const p = parts[o.v] || (parts[o.v] = {n: o.n, a: []});
    p.a[o.i] = o.d;
    let ok = true; for (let i = 0; i < p.n; i++) if (p.a[i] == null) ok = false;
    if (ok && o.v > cur) {
      cur = o.v;
      try { cb(JSON.parse(p.a.join(''))); } catch (e) { console.error(e); }
      Object.keys(parts).forEach(k => { if (+k < cur) delete parts[k]; });
    }
  };
};

/* ---------------- Utilitaires d'affichage ---------------- */
KR.fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

}).join('');

</script><script>KR.PUB={"missions":[{"id":"MI01","titre":"L’adresse MAC et son fabricant","dom":"S","contexte":"Un scanner inconnu apparaît sur le réseau de l’entrepôt avec l’adresse MAC 00:1A:2B:3C:4D:5E. Le filtrage MAC de TransLor ne contient que les 40 adresses de l’inventaire.","q1":"Quelle partie de l’adresse identifie le fabricant, et combien de bits représente-t-elle ?","q2":"Pourquoi le filtrage MAC ne suffit-il pas pour sécuriser l’accès à l’entrepôt ?","opts":["Parce qu’une adresse MAC a 48 bits","Parce que les switchs ne savent pas filtrer les MAC","Parce que le filtrage MAC est interdit par la loi","Parce qu’elle circule en clair et se copie facilement : elle n’authentifie rien"]},{"id":"MI02","titre":"Quel masque générique ?","dom":"S","contexte":"Une ACL doit autoriser le bloc de la direction : 10.1.20.64/27. Le routeur Cisco veut un masque générique (wildcard).","q1":"Donnez la première adresse, la dernière adresse et le masque générique de ce bloc.","q2":"Quelle ligne autorise ce bloc, et lui seul, vers le serveur de fichiers 10.1.40.10 ?","opts":["permit ip 10.1.20.64 0.0.0.255 host 10.1.40.10","permit ip 10.1.20.64 0.0.0.31 host 10.1.40.10","permit ip 10.1.20.0 0.0.0.31 host 10.1.40.10","permit ip any host 10.1.40.10"]},{"id":"MI03","titre":"L’ordre des règles","dom":"S","contexte":"Une ACL de TransLor, lue de haut en bas : (1) deny ip host 10.1.30.5 any ; (2) permit ip 10.1.30.0 0.0.0.255 any ; (3) deny ip any any. La première règle qui correspond s’applique.","q1":"Que devient un paquet venant de 10.1.30.5, un autre de 10.1.30.6, un troisième de 10.1.40.1 ?","q2":"On inverse les règles 1 et 2. Que devient 10.1.30.5 ?","opts":["Il reste refusé","Il est mis en quarantaine","Il est autorisé, la règle large passe avant la règle précise","Le routeur affiche une erreur"]},{"id":"MI04","titre":"Lire la configuration d’un trunk","dom":"S","contexte":"Configuration du trunk entre deux switchs : allowed vlan 10,20,30,40 ; native vlan 10. Les VLAN 10 (direction), 20 (entrepôt), 30 (tablettes), 40 (serveurs) circulent.","q1":"Combien de VLAN circulent avec une étiquette 802.1Q et lequel circule sans étiquette ?","q2":"Quelle correction durcit ce trunk contre le double tag ?","opts":["Passer le native VLAN sur le VLAN 40 des serveurs","Supprimer le VLAN 20","Autoriser tous les VLAN sur le trunk","Utiliser un native VLAN dédié et inutilisé (ex. 999)"]},{"id":"MI05","titre":"Découper le réseau plat de TransLor","dom":"S","contexte":"TransLor veut séparer cinq VLAN : direction 24 postes, entrepôt 40, tablettes 100, serveurs 10, invités 30. Prévoir 1 adresse de passerelle par VLAN, sans croissance. Tailles disponibles : /27 (30 utilisables), /26 (62), /25 (126), /28 (14).","q1":"Donnez le masque de chaque VLAN.","q2":"Les cinq blocs tiennent-ils dans l’actuel 192.168.1.0/24 (256 adresses) ?","opts":["Oui, il reste de la marge","Non : 32 + 64 + 128 + 16 + 64 = 304, supérieur à 256","Oui : 32 + 64 + 128 + 16 + 64 = 244","Non : 24 + 40 + 100 + 10 + 30 = 204, supérieur à 256"]},{"id":"MI06","titre":"Qui devient Root Bridge ?","dom":"S","contexte":"Trois switchs STP : SW1 priorité 32768, MAC 00:1A:00:00:00:10 ; SW2 priorité 32768, MAC 00:1A:00:00:00:05 ; SW3 priorité 16384, MAC 00:1A:00:00:00:FF. Le Root Bridge est le switch avec la priorité la plus basse ; en cas d’égalité, l’adresse MAC la plus basse.","q1":"Quel switch devient Root Bridge ? Et si SW3 est éteint ?","q2":"Comment empêcher un switch inconnu, branché en salle de pause, de devenir racine ?","opts":["Lui donner un autre nom","Désactiver STP partout","Activer Root Guard et BPDU Guard sur les ports d’accès","Augmenter la priorité de SW3"]},{"id":"MI07","titre":"Combien de temps pour casser ?","dom":"A","contexte":"Un attaquant teste 10 milliards (10¹⁰) de mots de passe par seconde contre des hachés rapides. Un gestionnaire a choisi 10 caractères parmi 36 (minuscules et chiffres). La politique voudrait 12 caractères parmi 62.","q1":"Combien de temps pour tester toutes les combinaisons de ce mot de passe de 10 caractères ?","q2":"Quel est l’ordre de grandeur pour 12 caractères parmi 62 ?","opts":["Environ 4 jours encore","Environ 10 200 ans","Environ 6 heures","Environ 3 secondes"]},{"id":"MI08","titre":"Lire une ligne de /etc/shadow","dom":"A","contexte":"Ligne du serveur Linux de TransLor : alice:$6$Xq3k9a$Rj0w…Zt1:19700:0:90:7:::  Le préfixe $6$ désigne SHA-512 ; entre le deuxième et le troisième $ se trouve le sel.","q1":"Quel est l’algorithme, quel est le sel, et au bout de combien de jours le mot de passe doit-il être changé ?","q2":"Deux utilisateurs ont le même mot de passe mais des sels différents. Que voit-on dans le fichier ?","opts":["Deux hachés identiques","Un seul haché pour les deux","Aucun haché","Deux hachés différents"]},{"id":"MI09","titre":"Combien de mots de passe identiques ?","dom":"A","contexte":"Extrait d’une base SANS sel : bob 5f4dcc3b…cf99 ; carole 482c811d…a0b3 ; dan 5f4dcc3b…cf99 ; eve 5f4dcc3b…cf99 ; fred 7c6a180b…1d0a ; gina 5f4dcc3b…cf99.","q1":"Combien de comptes ont le même mot de passe, et quelle part des 6 cela représente-t-il ?","q2":"Quelle correction supprime ce problème ?","opts":["Un haché plus court","Cacher la base de données","Un haché lent avec un sel différent par compte","Demander aux utilisateurs de ne pas choisir le même mot de passe"]},{"id":"MI10","titre":"Les facteurs d’authentification","dom":"A","contexte":"TransLor prépare le MFA. Quatre éléments : (1) code TOTP de l’application ; (2) code PIN de 6 chiffres ; (3) empreinte digitale ; (4) clé de sécurité USB FIDO2.","q1":"Classez chaque élément : connaissance, possession ou inhérence.","q2":"Un PIN et un mot de passe forment-ils une authentification multifacteur ?","opts":["Non, ce sont deux facteurs de connaissance","Oui, ce sont deux éléments","Oui, car le PIN est court","Non, il manque l’empreinte"]},{"id":"MI11","titre":"La fatigue MFA","dom":"A","contexte":"Journal du MFA : 18 demandes de validation en 12 minutes sur le compte de la comptable. 17 sont refusées, la 18e est approuvée à 02 h 14.","q1":"Quelle est la fréquence moyenne des demandes par minute, et quelle part a été refusée ?","q2":"Quelle mesure empêche le plus directement cette attaque ?","opts":["Envoyer encore plus de notifications","Demander de saisir un nombre affiché à l’écran, limiter les demandes et alerter","Supprimer le MFA","Changer l’heure des notifications"]},{"id":"MI12","titre":"L’ordre de Kerberos","dom":"A","contexte":"Un salarié ouvre une session puis accède au serveur de fichiers. Trois étapes : (X) présenter le ticket de service au serveur de fichiers ; (Y) obtenir un TGT auprès du KDC avec son mot de passe ; (Z) demander au KDC un ticket de service avec le TGT.","q1":"Dans quel ordre se déroulent ces étapes ?","q2":"Un poste a une horloge en retard de 8 minutes. Que se passe-t-il, avec la tolérance Kerberos par défaut ?","opts":["L’authentification échoue : la tolérance par défaut est de 5 minutes","Rien, Kerberos ne mesure pas le temps","L’authentification réussit mais plus lentement","Le poste obtient plus de droits"]},{"id":"MI13","titre":"La chaîne AGDLP","dom":"Z","contexte":"Pour le dossier « Tarifs », TransLor veut : comptabilité en modification, litiges en lecture. Éléments : comptes (A), groupes globaux de métier (G), groupes de domaine local (DL), permissions (P).","q1":"Placez dans l’ordre les maillons de la chaîne AGDLP et donnez le rôle de chacun.","q2":"Un nouveau comptable arrive. Que faut-il faire sur le serveur de fichiers ?","opts":["Modifier l’ACL du dossier pour ajouter son compte","Rien : l’ajouter au groupe global de la comptabilité","Lui donner un compte administrateur temporaire","Copier les droits d’un collègue à la main"]},{"id":"MI14","titre":"Les droits effectifs","dom":"Z","contexte":"Sur le partage « Litiges » : permission de partage « Lecture » pour tous ; permissions NTFS : groupe Litiges « Modifier », groupe Stagiaires « Lecture ». Camille est membre des deux groupes.","q1":"Quels sont les droits NTFS cumulés de Camille, et quel est son droit effectif à travers le réseau ?","q2":"Que faut-il retenir pour la conception des partages ?","opts":["Toujours restreindre le partage au maximum","Ne jamais utiliser de partage","Mettre « Contrôle total » sur le partage et gérer les droits en NTFS","Donner Lecture à tout le monde"]},{"id":"MI15","titre":"Des droits en trop","dom":"Z","contexte":"Matrice des droits accordés : Alice Tarifs RW, Litiges R ; Bob Tarifs R, Litiges RW ; Carole Litiges RW, Paie R ; Dan Tarifs RW, Paie RW. Besoins réels : Alice Tarifs RW ; Bob Tarifs R, Litiges R ; Carole Litiges RW ; Dan Paie RW.","q1":"Combien de droits accordés dépassent le besoin, et quelle part des 8 droits accordés ?","q2":"Quel principe corrige ce constat ?","opts":["Le droit à l’erreur","Le moindre privilège : donner seulement ce dont chacun a besoin","La séparation du réseau en VLAN","Le hachage des mots de passe"]},{"id":"MI16","titre":"Arrivée, mutation, départ : la conformité","dom":"Z","contexte":"Sur l’année, 12 salariés sont partis. Comptes désactivés le jour du départ : 9 ; après 3 semaines : 2 ; jamais : 1.","q1":"Quel est le taux de départs traités conformément à la règle « désactivation le jour J », et combien de comptes restent exposés ?","q2":"Quelle mesure améliore le plus durablement ce taux ?","opts":["Une note de rappel aux managers","Supprimer les comptes une fois par an","Un processus où les RH déclenchent automatiquement la coupure de tous les accès","Interdire aux salariés de partir"]},{"id":"MI17","titre":"Trop d’administrateurs","dom":"Z","contexte":"L’annuaire de TransLor compte 120 salariés et 13 comptes « Administrateurs du domaine ». La cible interne est de 2 % de l’effectif au plus.","q1":"Quelle part de l’effectif cela représente-t-il, et combien de comptes la cible autorise-t-elle ?","q2":"Comment continuer à administrer avec si peu de comptes ?","opts":["En partageant les mots de passe","En donnant les droits à tout le monde","Avec des comptes d’administration nominatifs distincts du compte du quotidien, et des droits délégués par niveau","En supprimant l’annuaire"]},{"id":"MI18","titre":"LSDOU : quelle GPO l’emporte ?","dom":"Z","contexte":"Verrouillage de session : GPO locale 15 min ; GPO du site : non définie ; GPO du domaine 10 min ; GPO de l’OU Entrepôt 5 min. Les GPO s’appliquent dans l’ordre Local, Site, Domaine, OU ; la dernière appliquée l’emporte.","q1":"Quel délai s’applique à un poste de l’OU Entrepôt ?","q2":"Le domaine passe sa GPO en mode « Appliqué » (Enforced). Quel délai s’applique alors ?","opts":["10 minutes","5 minutes","15 minutes","Aucun"]},{"id":"MI19","titre":"Lire un journal de sécurité Windows","dom":"T","contexte":"Extrait : 23:57:41 ID 4625 (échec) adupont depuis 203.0.113.7 ; 23:57:44 ID 4625 adupont ; 23:57:47 ID 4625 adupont ; 23:57:50 ID 4625 adupont ; 23:57:55 ID 4624 (succès) adupont ; 23:58:20 ID 4672 (privilèges spéciaux) adupont.","q1":"Combien d’échecs précèdent le succès, en combien de temps, et quel est le signal le plus inquiétant ?","q2":"Quelle règle d’alerte détecterait ce scénario ?","opts":["Alerter à chaque connexion réussie","Ne jamais alerter, on lit le journal le lundi","Alerter uniquement le week-end","Alerter si 4625 puis 4624 pour le même compte et la même adresse en moins de 60 secondes"]},{"id":"MI20","titre":"Lire un journal RADIUS","dom":"T","contexte":"Journal du serveur RADIUS sur 10 tentatives de connexion Wi-Fi : 7 Access-Accept et 3 Access-Reject. Les 3 rejets portent le motif « certificat expiré » et concernent les tablettes T12, T31 et T47.","q1":"Quel est le taux de rejet, et quelle est la cause ?","q2":"Quelle action prévient la récidive ?","opts":["Désactiver l’authentification 802.1X","Remplacer le certificat par un mot de passe partagé","Ignorer, ce sont des tablettes","Renouveler les certificats et mettre une alerte 30 jours avant l’expiration"]},{"id":"MI21","titre":"Une règle d’alerte à calibrer","dom":"T","contexte":"Règle : alerte si 5 échecs ou plus pour un même compte en 60 secondes. Compte X : échecs à 00:00:05, 00:00:20, 00:00:31, 00:00:44, 00:00:58 et 00:01:30. Compte Y : échecs à 00:00:10, 00:00:50, 00:01:40, 00:02:30 et 00:03:20.","q1":"Quel compte déclenche l’alerte, et à quelle heure ?","q2":"Un manager trouve que la règle fait trop de bruit. Que décidez-vous ?","opts":["La garder, ajuster le seuil par type de compte et exclure les comptes de test","La supprimer","Passer le seuil à 5 000","Éteindre le serveur de journaux"]},{"id":"MI22","titre":"La revue des droits","dom":"T","contexte":"TransLor a vérifié 160 appartenances à des groupes sensibles. 12 sont injustifiées (départ, mutation, accès temporaire oublié). La vérification prend 2 minutes par appartenance.","q1":"Quel est le taux d’écart, et quelle durée représente la revue ?","q2":"Qui doit décider si une appartenance est justifiée ?","opts":["Le responsable du groupe ou du métier, qui connaît le besoin","Le service informatique seul","Chaque utilisateur pour lui-même","Le DG"]},{"id":"MI23","titre":"Les horloges ne sont pas d’accord","dom":"T","contexte":"Pour un même événement, le journal du pare-feu indique 14 h 02 min 10 s et celui du serveur d’annuaire 14 h 09 min 40 s. Kerberos tolère 5 minutes d’écart.","q1":"Quel est l’écart entre les deux horloges, et dépasse-t-il la tolérance de Kerberos ?","q2":"Quelle correction mettez-vous en place ?","opts":["Changer l’heure à la main chaque semaine","Supprimer les horodatages des journaux","Allonger la tolérance Kerberos à 1 heure","Synchroniser toutes les machines sur une source NTP commune"]},{"id":"MI24","titre":"Un indicateur, un risque","dom":"T","contexte":"Tableau de bord des accès de TransLor : 120 comptes dont 90 avec le MFA actif. 18 comptes n’ont pas servi depuis plus de 90 jours.","q1":"Quelle est la part de comptes sans MFA, et la part de comptes inactifs ?","q2":"L’indicateur « % de comptes inactifs depuis 90 jours » est-il un KPI ou un KRI ?","opts":["Un KRI : il mesure l’exposition au risque, plus il monte, plus le risque augmente","Un KPI : il mesure la performance du service informatique","Ni l’un ni l’autre","Un indicateur financier"]}],"injects":[{"id":"IN0","titre":"VENDREDI 23 H 58","heure":"Vendredi 23 h 58","histoire":"Le compte VPN d’un ancien prestataire, parti il y a 4 mois, se connecte sans second facteur. Il atteint le TMS depuis un réseau sans cloisonnement et télécharge la base clients : 1,8 Go en 12 minutes.","q":null,"opts":null},{"id":"IN1","titre":"Inject H+0","heure":"Vendredi 23 h 59","histoire":"L’alerte du VPN signale la connexion du compte presta-martin depuis une adresse à l’étranger. Le contrat de ce prestataire a pris fin en juin. Le TMS est consulté en ce moment même.","q":"Quelle est votre première action ?","opts":["Changer le mot de passe du compte et attendre","Supprimer le compte pour effacer les traces","Désactiver le compte, couper ses sessions et conserver les journaux","Ne rien faire avant lundi, l’équipe est absente"]},{"id":"IN2","titre":"Inject H+3","heure":"Samedi 3 h 00","histoire":"Audit éclair des comptes prestataires : 14 comptes existent. Les contrats de 9 d’entre eux sont terminés, mais seuls 4 de ces 9 comptes ont été désactivés.","q":"Combien de comptes sont actifs à tort, et quelle part des 14 comptes cela représente-t-il ?","opts":["4 comptes, soit 29 %","5 comptes, soit 36 %","9 comptes, soit 64 %","10 comptes, soit 71 %"]},{"id":"IN3","titre":"Inject H+24","heure":"Samedi 23 h 00","histoire":"Les journaux montrent que l’attaquant a élargi ses droits en utilisant un compte « Administrateur du domaine ». L’annuaire de TransLor, qui compte 120 salariés, contient 13 comptes de ce type, utilisés aussi pour lire les e-mails.","q":"Quelle correction structurelle décidez-vous ?","opts":["Garder les 13 comptes mais changer leurs mots de passe","Réduire à 2 ou 3 comptes nominatifs séparés des comptes du quotidien, utilisés seulement pour administrer","Supprimer tous les comptes d’administrateur","Partager un seul compte entre les administrateurs"]},{"id":"IN4","titre":"Inject H+60","heure":"Lundi 9 h 00","histoire":"Un grand client (20 % du CA) demande, avant de renouveler son contrat, la preuve que les accès à ses données sont maîtrisés.","q":"Quelle preuve lui fournissez-vous ?","opts":["Une déclaration du DG indiquant que tout va bien","Le compte rendu de la dernière revue trimestrielle des droits : groupes, membres recertifiés, écarts corrigés, dates","La liste de tous les mots de passe pour qu’il vérifie","Une copie de la configuration du pare-feu"]}],"mesures":[[1,"VLAN par métier","Réseau découpé en VLAN par métier et par risque","S",3,"Direction, entrepôt, tablettes, serveurs, invités, prestataires : chacun son VLAN."],[2,"ACL entre VLAN","ACL entre VLAN : tout refuser sauf le nécessaire","S",2,"Le routeur ou le pare-feu ne laisse passer que les flux listés, dans le bon ordre."],[3,"Trunks durcis","Trunks et ports durcis (native VLAN, VLAN autorisés)","S",2,"Native VLAN inutilisé, VLAN listés sur les trunks, ports libres coupés, Root Guard."],[4,"802.1X + RADIUS","802.1X et RADIUS (EAP-TLS) sur prises et Wi-Fi","S",4,"Aucun appareil n’obtient un port ou le Wi-Fi sans s’être authentifié."],[5,"Mots de passe solides","Mots de passe longs, hachés avec sel, sans valeur d’usine","A",2,"Au moins 12 caractères, hachage lent et salé, mots de passe d’usine changés."],[6,"MFA","Authentification multifacteur (VPN, messagerie, admins)","A",2,"Un mot de passe volé ne suffit plus : code TOTP ou clé physique."],[7,"Annuaire durci","Annuaire AD durci, Kerberos et horloges synchronisées","A",4,"Peu d’administrateurs de domaine, niveaux d’administration, NTP, sauvegarde de l’AD."],[8,"Droits par groupes","Droits par groupes (AGDLP), moindre privilège","Z",3,"Les droits suivent le métier, jamais la personne : plus d’ACL au cas par cas."],[9,"Comptes nominatifs","Comptes nominatifs, administration séparée","Z",2,"Fin     else {
      h += `<div class="card"><h3>Mission ${c.mid} <span id="tmr" style="float:right"></span></h3>
      ${!c.rev ? `<button class="btn alt sm" onclick="act.addTime()">+30 s</button> <button class="btn red" onclick="act.reveal()">Révéler la correction aux joueurs</button>` : '<span class="ok">Correction révélée.</span>'}</div>`;
      h += liveStatus(c.mid);
      if (c.rev) {
        const s = SEC.missions[c.mid], ta = G.tans[c.mid] || {};
        h += `<div class="card"><h3>Validation des points d’équipe</h3><table><tr><th>Équipe</th><th>Q1 : réponse d’équipe</th><th>Attendu</th><th>Q1 juste ?</th><th>Q2</th></tr>` + G.teams.map((T, i) => {
          const x = ta[i], v = c.q1ok && c.q1ok[i];
          return `<tr><td><span class="pill" style="background:${T.c}">${KR.esc(T.n)}</span></td><td>${x ? KR.esc(x.q1 || '(vide)') : '<span class="muted">aucune</span>'}</td><td class="muted">${KR.esc(s.r1)}</td>
          <td>${x ? `<button class="btn sm ${v === true ? 'green' : 'alt'}" ${c.scored ? 'disabled' : ''} onclick="act.q1ok(${i},true)">✓ juste</button> <button class="btn sm ${v === false ? 'red' : 'alt'}" ${c.scored ? 'disabled' : ''} onclick="act.q1ok(${i},false)">✗ non</button> ${c.q1src && c.q1src[i] === 'auto' ? '<div class="muted">pré-corrigé automatiquement</div>' : c.q1src && c.q1src[i] === '?' ? '<div class="ko">⚠ réponse partielle : à vérifier</div>' : c.q1src && c.q1src[i] === 'manu' ? '' : '<div class="muted">à corriger par vous</div>'}` : '—'}</td>
          <td>${x ? (x.q2 === s.rep ? '<span class="ok">' + KR.LET[x.q2] + ' ✔</span>' : '<span class="ko">' + (x.q2 >= 0 ? KR.LET[x.q2] : '—') + ' ✗</span>') : '—'}</td></tr>`;
        }).join('') + `</table>${c.scored ? '<p class="ok">✔ Points appliqués.</p>' : '<button class="btn green" onclick="act.scoreMission()">Valider et appliquer les points</button><p class="muted">Q1 juste : +2 jetons +1 point · Q2 juste : +1 jeton +1 point. Points personnels : Q2 juste +1, Q1 auto-évaluée juste +1, aide −1.</p>'}</div>`;
      }
      h += corrMission(c.mid);
    }
  } else if (st.k === 'marche') {
    h += `<div class="card"><h3>Marché</h3><p class="muted">Les porte-parole cochent leurs achats sur leur téléphone (le coût est retiré automatiquement). Vous pouvez corriger dans le tableau ci-dessous en cliquant sur un numéro de mesure (action sans contrôle de jetons).</p>
    <table><tr><th>N°</th><th>Mesure</th><th>Domaine</th><th>Coût</th></tr>${KR.PUB.mesures.map(m => `<tr><td>${m[0]}</td><td>${KR.esc(m[1])}</td><td><span class="pill" style="background:${KR.DOM[m[3]].c}">${KR.DOM[m[3]].nom}</span></td><td>${m[4]}</td></tr>`).join('')}</table></div>`;
  } else if (st.k === 'menaces') {
    const usedIds = (c.men || []).map(m => m.id);
    h += `<div class="card"><h3>Menaces de la semaine</h3><select onchange="setUi('men',this.value)"><option value="">— menace retournée —</option>${SEC.menaces.map(M => `<option value="${M.id}" ${ui.men === M.id ? 'selected' : ''} ${usedIds.includes(M.id) ? 'disabled' : ''}>${M.id} · ${KR.esc(M.titre)} (grav. ${M.grav})</option>`).join('')}</select>
    <button class="btn" onclick="act.validateMenace()">Valider pour toutes les équipes</button>${ui.men ? corrMenace(ui.men) : ''}</div>`;
    (c.men || []).forEach(m => {
      h += `<div class="card"><b>${m.id} · ${KR.esc(m.titre)}</b> <button class="btn alt sm" style="float:right" onclick="act.undoMenace('${m.id}')">Annuler</button><table>` + G.teams.map((T, i) => {
        const r = m.res[i]; const lab = r.o === 'F' ? '<span class="ok">Repoussée +3</span>' : r.o === 'L' ? '<span class="ok">Limitée +1</span>' : `<span class="ko">Touchée −${m.grav}</span>`;
        return `<tr><td><span class="pill" style="background:${T.c}">${KR.esc(T.n)}</span></td><td>${lab}</td><td>${r.o === 'T' ? (r.d != null ? `dé ${r.d} → −${r.jl} jeton${r.jl > 1 ? 's' : ''}` : `dé : <select onchange="act.setDie('${m.id}',${i},this.value)"><option value="">?</option>${[1,2,3,4,5,6].map(d => `<option>${d}</option>`).join('')}</select>`) : ''}</td></tr>`;
      }).join('') + '</table></div>';
    });
  } else if (st.k === 'next') {
    h += `<div class="card"><h3>Semaine suivante</h3><p class="ok">✔ +1 jeton de revenu de base a été ajouté à chaque équipe.</p><p>Défaussez les menaces résolues, descendez celles de la semaine prochaine, tirez-en deux nouvelles, avancez le marqueur de semaine.</p></div>`;
  } else if (st.k === 'inj') {
    if (!c.iopen) h += `<div class="card"><h3>${KR.esc(st.id)} · ${KR.esc((KR.PUB.injects.find(x => x.id === st.id) || {}).titre)}</h3><button class="btn" onclick="act.openInject()">Ouvrir l’inject (1 min)</button></div>` + corrInject(st.id);
    else { h += `<div class="card"><h3>${st.id} <span id="tmr" style="float:right"></span></h3>${c.scored ? '<span class="ok">✔ Corrigé et points appliqués (+3 aux équipes qui ont la bonne lettre).</span>' : '<button class="btn red" onclick="act.scoreInject()">Corriger et appliquer les points</button>'}</div>` + liveStatus(st.id) + corrInject(st.id); }
  } else if (st.k === 'final') {
    const IN0 = SEC.injects.IN0 || {}, I = KR.PUB.injects.find(x => x.id === 'IN0');
    h += `<div class="card"><h3>Vendredi 23 h 58</h3><p class="muted">Mesures 6 ET 10 : repoussée +5 · une seule : limitée +2 · aucune : touchée −4.</p>${c.fin ? '<p class="ok">✔ Résultat appliqué.</p>' : '<button class="btn red" onclick="act.final()">Calculer l’attaque finale</button>'}
      ${I ? `<p>${KR.esc(I.histoire)}</p>` : ''}<p>${KR.esc(IN0.pourquoi || '')}</p></div>`;
  } else if (st.k === 'bonus') {
    h += `<div class="card"><h3>Bonus</h3><p class="muted">Accès complet (une mesure par domaine) +3 · jetons restants : 1 point pour 2.</p>${c.bon ? '<p class="ok">✔ Bonus appliqués.</p>' : '<button class="btn green" onclick="act.bonus()">Calculer les bonus</button>'}</div>`;
  } else if (st.k === 'end') {
    h += rankingCard();
  }
  return h;
}
function rankingCard() {
  const arr = G.teams.map((T, i) => ({T, i})).sort((a, b) => b.T.p - a.T.p || b.T.m.filter(x => x).length - a.T.m.filter(x => x).length || b.T.j - a.T.j);
  const pl = Object.keys(G.pl).map(p => ({p, ...G.pl[p]})).sort((a, b) => (b.pp || 0) - (a.pp || 0));
  return `<div class="card"><h3>Classement final des équipes</h3>` + arr.map((x, r) => `<div style="padding:4px 0"><b>${r + 1}.</b> <span class="pill" style="background:${x.T.c}">${KR.esc(x.T.n)}</span> <b>${x.T.p} pts</b> · ${KR.titre(x.T.p)} <span class="muted">(${x.T.m.filter(v => v).length} mesures, ${x.T.j} jetons)</span></div>`).join('') +
    `</div><div class="card"><h3>Classement individuel (vous seul)</h3>` + pl.map((x, r) => `<div>${r + 1}. ${KR.esc(x.n)} <span class="muted">(${KR.esc(G.teams[x.t].n)})</span> : <b>${x.pp || 0}</b></div>`).join('') + '</div>';
}
function joinUrl() { const u = new URL('joueur.html', location.href); u.hash = 's=' + G.sid + (G.relay !== KR.DEFAULT_RELAY ? '&r=' + encodeURIComponent(G.relay) : ''); return u.href; }
function projUrl() { const u = new URL('avancement.html', location.href); u.hash = 's=' + G.sid + (G.relay !== KR.DEFAULT_RELAY ? '&r=' + encodeURIComponent(G.relay) : ''); return u.href; }
function qrSvg(text, size) { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({cellSize:Math.max(2, Math.floor(size / q.getModuleCount())), margin:2, scalable:true}); }
function sessionCard() {
  return `<div class="card"><h3>Séance ${G.sid}</h3><div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
  <div style="width:210px">${qrSvg(joinUrl(), 210)}<div class="muted" style="text-align:center">Les joueurs scannent ce QR</div></div>
  <div style="flex:1;min-width:240px"><p><b>Lien joueurs</b><br><input readonly value="${KR.esc(joinUrl())}" style="width:100%" onclick="this.select()"></p>
  <p><b>Lien écran projeté</b> (à ouvrir dans une autre fenêtre, plein écran)<br><input readonly value="${KR.esc(projUrl())}" style="width:100%" onclick="this.select()"> <button class="btn alt sm" onclick="window.open('${KR.esc(projUrl())}','krproj')">Ouvrir</button></p>
  <p class="muted">${relayStatus} · relais : ${KR.esc(G.relay)}</p></div></div></div>`;
}
function rosterCard() {
  return `<div class="card"><h3>Joueurs inscrits (${Object.keys(G.pl).length})</h3>` + G.teams.map((T, i) => `<div><span class="pill" style="background:${T.c}">${KR.esc(T.n)}</span> ${members(i).map(p => `<span class="tag">${KR.esc(G.pl[p].n)} <select onchange="act.movePl('${p}',this.value)">${G.teams.map((U, j) => `<option value="${j}" ${j === i ? 'selected' : ''}>${KR.esc(U.n)}</option>`).join('')}</select> <a href="#" onclick="act.rmPl('${p}');return false">✕</a></span>`).join(' ') || '<span class="muted">aucun</span>'}</div>`).join('') + `</div>`;
}
function resultsTab() {
  const ids = Object.keys(G.ans);
  const rows = Object.keys(G.pl).map(p => ({p, ...G.pl[p]}));
  let h = `<div class="card"><h3>Équipes</h3><table><tr><th>Équipe</th><th>Points</th><th>Jetons</th><th>Mesures</th><th>Titre</th></tr>${G.teams.map(T => `<tr><td><span class="pill" style="background:${T.c}">${KR.esc(T.n)}</span></td><td><b>${T.p}</b></td><td>${T.j}</td><td>${KR.owned(T).join(', ') || '—'}</td><td>${KR.titre(T.p)}</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><h3>Joueurs (points personnels)</h3><table><tr><th>Joueur</th><th>Équipe</th><th>Points</th><th>Aides</th>${ids.map(i => `<th>${i}</th>`).join('')}</tr>` + rows.sort((a, b) => (b.pp || 0) - (a.pp || 0)).map(r => `<tr><td>${KR.esc(r.n)}</td><td>${KR.esc(G.teams[r.t].n)}</td><td><b>${r.pp || 0}</b> <button class="btn alt sm" onclick="act.setPP('${r.p}',-1)">−</button><button class="btn alt sm" onclick="act.setPP('${r.p}',1)">+</button></td><td>${G.aids.filter(a => a.pid === r.p).length}</td>
   ${ids.map(i => { const x = G.ans[i][r.p]; if (!x) return '<td class="muted">—</td>'; const s = SEC.missions[i], inj = SEC.injects[i]; const rep = s ? s.rep : inj ? inj.rep : null; const ok2 = rep != null && x.q2 === rep; return `<td>${s ? 'Q1 ' + (x.sc === 1 ? '✔' : x.sc === 0 ? '✗' : '?') + ' · ' : ''}Q2 ${x.q2 >= 0 ? (ok2 ? '<span class="ok">✔</span>' : '<span class="ko">✗ ' + KR.LET[x.q2] + '</span>') : '—'}</td>`; }).join('')}</tr>`).join('') + `</table></div>`;
  h += `<div class="card"><button class="btn" onclick="exportCsv()">Exporter en CSV (joueurs et équipes)</button></div>`;
  return h;
}
function aidsTab() {
  const byP = {}; G.aids.forEach(a => (byP[a.pid] = byP[a.pid] || []).push(a));
  return `<div class="card"><h3>Aides demandées</h3>${G.aids.length ? '<table><tr><th>Joueur</th><th>Équipe</th><th>Nb</th><th>Détail</th></tr>' + Object.keys(byP).map(p => `<tr><td>${KR.esc(G.pl[p] ? G.pl[p].n : p)}</td><td>${G.pl[p] ? KR.esc(G.teams[G.pl[p].t].n) : ''}</td><td><b>${byP[p].length}</b></td><td>${byP[p].map(a => a.mid + ' ' + a.kind.toUpperCase()).join(', ')}</td></tr>`).join('') + '</table>' : '<p class="muted">Aucune aide demandée pour l’instant.</p>'}
   <p class="muted">Aide Q1 : donne la première étape de la correction. Aide Q2 : écarte une réponse fausse. Chaque aide coûte 1 point personnel.</p></div>`;
}
function corrigesTab() {
  const sel = ui.cs || 'm', cats = [['m', 'Missions'], ['x', 'Menaces'], ['i', 'Injects'], ['d', 'DG'], ['z', 'Mesures']];
  const items = {m:KR.PUB.missions.map(m => [m.id, m.id + ' · ' + m.titre]), x:SEC.menaces.map(m => [m.id, m.id + ' · ' + m.titre]), i:['IN1', 'IN2', 'IN3', 'IN4'].map(id => { const I = KR.PUB.injects.find(x => x.id === id); return [id, id + (I ? ' · ' + I.titre : '')]; }), d:SEC.dg.map(d => [d.id, d.id + ' · ' + d.titre])};
  let h = `<div class="card"><b>Corrigés :</b> ${cats.map(c => `<button class="btn ${sel === c[0] ? '' : 'alt'} sm" onclick="ui.ci='';setUi('cs','${c[0]}')">${c[1]}</button>`).join(' ')}</div>`;
  if (sel === 'z') return h + `<div class="card"><h3>Les 12 mesures</h3><table>${KR.PUB.mesures.map(m => `<tr><td>${m[0]}</td><td><b>${KR.esc(m[2])}</b><div class="muted">${KR.esc(m[5])}</div></td><td>${KR.DOM[m[3]].nom}</td><td>${m[4]} j.</td></tr>`).join('')}</table></div>`;
  h += `<div class="card"><div style="display:flex;flex-wrap:wrap;gap:6px">${items[sel].map(x => `<button class="btn sm ${ui.ci === x[0] ? '' : 'alt'}" style="text-align:left" onclick="setUi('ci','${x[0]}')">${KR.esc(x[1])}</button>`).join('')}</div></div>`;
  const id = ui.ci;
  if (!id || !items[sel].some(x => x[0] === id)) return h + '<div class="card muted">Cliquez sur un bouton pour afficher le corrigé détaillé.</div>';
  if (sel === 'm') return h + corrMission(id);
  if (sel === 'x') return h + corrMenace(id);
  if (sel === 'i') return h + corrInject(id);
  const d = SEC.dg.find(z => z.id === id); return h + `<div class="card"><h3>${d.id} · ${KR.esc(d.titre)}</h3><p>${KR.esc(d.effet)}</p><p class="muted">${KR.esc(d.lecon)}</p></div>`;
}
window.exportCsv = () => {
  const q = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  let l = ['type;nom;equipe;points;jetons;aides;mesures'];
  G.teams.forEach(T => l.push(['equipe', T.n, T.n, T.p, T.j, '', KR.owned(T).join(' ')].map(q).join(';')));
  Object.keys(G.pl).forEach(p => { const P = G.pl[p]; l.push(['joueur', P.n, G.teams[P.t].n, P.pp || 0, '', G.aids.filter(a => a.pid === p).length, ''].map(q).join(';')); });
  l.push(''); l.push('journal;semaine;equipe;jetons;points;motif');
  G.log.forEach(e => l.push(['journal', e.w, G.teams[e.t] ? G.teams[e.t].n : '', e.dj, e.dp, e.why].map(q).join(';')));
  const b = new Blob(['﻿' + l.join('\n')], {type:'text/csv'}); const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = (G.test ? 'TEST_' : '') + 'cles-du-royaume_resultats.csv'; a.click();
};
function stepBar() {
  const n = KR.steps.length;
  return `<div style="height:8px;background:#dfe5f3;border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.round(100 * G.si / (n - 1))}%;background:#1B2A49"></div></div>`;
}
function render() {
  const st = curStep();
  const tabs = [['pilot', 'Pilotage'], ['corr', 'Corrigés'], ['res', 'Résultats'], ['aid', 'Aides'], ['ses', 'Séance']];
  let body = tab === 'pilot' ? pilotPanel() : tab === 'corr' ? corrigesTab() : tab === 'res' ? resultsTab() : tab === 'aid' ? aidsTab() : sessionCard() + `<div class="card"><button class="btn red" onclick="act.reset()">Effacer la séance</button></div>`;
  $('app').innerHTML = `<div style="position:sticky;top:0;background:#EEF1F8;z-index:5;padding:8px 0">
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:1.1em;flex:1;min-width:230px">${G.test ? '<span class="pill" style="background:#C77700">TEST</span> ' : ''}${KR.esc(KR.stepLabel(st))}</b>${G.test ? `<select onchange="act.goto(this.value)" title="Aller à l’étape">${KR.steps.map((x, i) => `<option value="${i}" ${i === G.si ? 'selected' : ''}>${i}. ${KR.esc(KR.stepLabel(x))}</option>`).join('')}</select>` : ''}<span class="muted">${relayStatus}</span>
   <button class="btn" ${G.si >= KR.steps.length - 1 ? 'disabled' : ''} onclick="act.next()">Étape suivante ▶</button></div>${stepBar()}
   <div style="margin-top:8px">${tabs.map(t => `<button class="btn sm ${tab === t[0] ? '' : 'alt'}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join(' ')}</div></div>
   ${body}${tab === 'pilot' && st.k !== 'lobby' ? teamsTable() + rosterCard() : ''}`;
}

/* ---------- démarrage ---------- */
function boot() {
  $('lock').style.display = 'none'; $('app').style.display = 'block';
  if (ui.resume || ui.resumeT) {
    const box = (x, lab, cls) => x ? `<p><b>${lab}</b> : séance ${x.sid}, étape : ${KR.esc(KR.stepLabel(KR.steps[x.si]))}.<br><button class="btn" onclick="resume(${cls})">Reprendre ${lab.toLowerCase()}</button></p>` : '';
    $('app').innerHTML = `<div class="card"><h2>Séance en cours trouvée</h2>${box(ui.resume, 'Séance réelle', 'ui.resume')}${box(ui.resumeT, 'Séance de test', 'ui.resumeT')}
     <button class="btn alt" onclick="ui.resume=null;ui.resumeT=null;boot()">Nouvelle séance</button></div>`;
    return;
  }
  $('app').innerHTML = `<div class="card"><h2>Nouvelle séance</h2>
   <p>Nombre d’équipes : <select id="nt">${[2, 3, 4, 5].map(n => `<option ${n === 4 ? 'selected' : ''}>${n}</option>`).join('')}</select></p>
   <p>Relais (laisser par défaut sauf besoin) : <input id="rl" value="${KR.DEFAULT_RELAY}" style="width:260px"></p>
   <p><label><input type="checkbox" id="tst"> <b>Mode test</b> (joueurs fictifs, saut d’étape ; séance séparée de la séance réelle)</label></p>
   <button class="btn" onclick="newGame(+$('nt').value,$('rl').value,$('tst').checked)">Créer la séance</button>
   <p class="muted">Un QR code sera affiché pour que les joueurs rejoignent. Ouvrez ensuite l’écran projeté dans une autre fenêtre.</p></div>`;
}
window.resume = s => { ui.resume = null; ui.resumeT = null; resumeGame(s); };
window.newGame = newGame;
window.boot = boot;
</script>
</body></html>
